name: Build and Upload Debian Package

on:
  release:
    types: [published]

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          debhelper \
          python3-all \
          python3-setuptools \
          python3-wheel \
          python3-pip \
          python3-venv \
          dh-python \
          pybuild-plugin-pyproject \
          build-essential

    - name: Build .deb package
      run: |
        dpkg-buildpackage -us -uc -b
      env:
        DEB_BUILD_OPTIONS: nocheck

    - name: List built files (debug)
      run: ls -l ../

    - name: Move .deb into workspace
      run: mv ../python3-chatenium-uniend_*_all.deb ./builded.deb

    - name: Upload .deb to Release
      uses: svenstaro/upload-release-action@v2
      with:
        file: builded.deb
        overwrite: true
        tag: ${{ github.ref }}
        asset_name: uniend-$tag-all.deb
        repo_token: ${{ secrets.REPO_TOKEN }}

    - name: Clone APT Repo
      uses: actions/checkout@v3
      with:
        repository: chatenium/chatenium.github.io
        path: pages
        token: ${{ secrets.REPO_TOKEN }}

    - name: Update APT repo
      run: |
        mkdir -p pages/apt
        cp builded.deb pages/apt/
        cd pages/apt
        dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz
        cd ../
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Update APT repo for release ${{ github.ref_name }}" || echo "No changes to commit"
        git push origin main
