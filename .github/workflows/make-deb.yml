name: Build, Sign and Upload Debian Package

on:
  release:
    types: [published]

jobs:
  build-deb:
    runs-on: ubuntu-latest

    env:
      REPO: chatenium/chatenium.github.io
      DIST: stable
      COMPONENT: main
      ARCH: all

    steps:
    - name: Checkout source repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          debhelper \
          python3-all \
          python3-setuptools \
          python3-wheel \
          python3-pip \
          python3-venv \
          dh-python \
          pybuild-plugin-pyproject \
          build-essential \
          gnupg \
          dpkg-dev \
          apt-utils

    - name: Build .deb package
      run: |
        dpkg-buildpackage -us -uc -b
      env:
        DEB_BUILD_OPTIONS: nocheck

    - name: List built files (debug)
      run: ls -l ../

    - name: Move .deb into workspace
      run: mv ../python3-chatenium-uniend_*_all.deb ./builded.deb

    # -------------------------------
    # Clone GitHub Pages repo
    # -------------------------------
    - name: Clone APT repo
      uses: actions/checkout@v3
      with:
        repository: ${{ env.REPO }}
        path: pages
        token: ${{ secrets.REPO_TOKEN }}

    # -------------------------------
    # Import GPG key for signing
    # -------------------------------
    - name: Import GPG private key
      run: |
        echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
        gpg --list-keys

    # -------------------------------
    # Prepare standard Debian repo layout
    # -------------------------------
    - name: Prepare repo layout
      run: |
        mkdir -p pages/apt/pool/${{ env.COMPONENT }}
        # Move package into pool
        cp builded.deb pages/apt/pool/${{ env.COMPONENT }}/
        cd pages/apt

        # Generate Packages.gz
        mkdir -p dists/${{ env.DIST }}/${{ env.COMPONENT }}/binary-${{ env.ARCH }}
        dpkg-scanpackages pool/${{ env.COMPONENT }} /dev/null > dists/${{ env.DIST }}/${{ env.COMPONENT }}/binary-${{ env.ARCH }}/Packages
        gzip -c dists/${{ env.DIST }}/${{ env.COMPONENT }}/binary-${{ env.ARCH }}/Packages > dists/${{ env.DIST }}/${{ env.COMPONENT }}/binary-${{ env.ARCH }}/Packages.gz

        # Generate Release file
        apt-ftparchive release dists/${{ env.DIST }} > dists/${{ env.DIST }}/Release

        # Sign Release
        gpg --batch --yes -abs -o dists/${{ env.DIST }}/Release.gpg dists/${{ env.DIST }}/Release

    # -------------------------------
    # Commit and push updates
    # -------------------------------
    - name: Commit and push APT repo
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Update APT repo for release ${{ github.ref_name }}" || echo "No changes to commit"
        git checkout -B main
        git push origin main
        git commit -m "Update APT repo for release ${{ github.ref_name }}" || echo "No changes to commit"
        git push origin main
