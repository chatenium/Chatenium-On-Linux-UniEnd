name: Build, Sign and Upload Debian Package

on:
  release:
    types: [published]

jobs:
  build-deb:
    runs-on: ubuntu-latest

    env:
      REPO: chatenium/chatenium.github.io
      DIST: stable
      COMPONENT: main
      ARCH: all

    steps:
    # -------------------------------
    # Checkout source repo
    # -------------------------------
    - name: Checkout source repository
      uses: actions/checkout@v3

    # -------------------------------
    # Setup Python
    # -------------------------------
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    # -------------------------------
    # Install build dependencies
    # -------------------------------
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          debhelper \
          python3-all \
          python3-setuptools \
          python3-wheel \
          python3-pip \
          python3-venv \
          dh-python \
          pybuild-plugin-pyproject \
          build-essential \
          gnupg \
          dpkg-dev \
          apt-utils

    # -------------------------------
    # Build .deb package
    # -------------------------------
    - name: Build .deb package
      run: |
        dpkg-buildpackage -us -uc -b
      env:
        DEB_BUILD_OPTIONS: nocheck

    - name: List built files (debug)
      run: ls -l ../

    # -------------------------------
    # Detect built package
    # -------------------------------
    - name: Set package filename
      run: |
        PKG_FILE=$(ls ../python3-chatenium-uniend_*_all.deb)
        echo "PKG_FILE=$PKG_FILE" >> $GITHUB_ENV
        echo "Built package: $PKG_FILE"

    # -------------------------------
    # Upload .deb to GitHub Release
    # -------------------------------
    - name: Upload .deb to Release
      uses: svenstaro/upload-release-action@v2
      with:
        file: ${{ env.PKG_FILE }}
        overwrite: true
        tag: ${{ github.ref_name }}
        asset_name: chatenium-uniend-${{ github.ref_name }}_all.deb
        repo_token: ${{ secrets.REPO_TOKEN }}

    # -------------------------------
    # Clone GitHub Pages repo for APT
    # -------------------------------
    - name: Clone APT repo
      uses: actions/checkout@v3
      with:
        repository: ${{ env.REPO }}
        path: pages
        token: ${{ secrets.REPO_TOKEN }}

    # -------------------------------
    # Import GPG key for signing
    # -------------------------------
    - name: Import GPG private key
      run: |
        echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
        gpg --list-keys

    # -------------------------------
    # Prepare standard Debian repo layout
    # -------------------------------
    - name: Prepare repo layout
      run: |
        mkdir -p pages/apt/pool/${{ env.COMPONENT }}
        cp "${{ env.PKG_FILE }}" pages/apt/pool/${{ env.COMPONENT }}/
        cd pages/apt

        # Generate Packages.gz
        mkdir -p dists/${{ env.DIST }}/${{ env.COMPONENT }}/binary-${{ env.ARCH }}
        dpkg-scanpackages pool/${{ env.COMPONENT }} /dev/null > dists/${{ env.DIST }}/${{ env.COMPONENT }}/binary-${{ env.ARCH }}/Packages
        gzip -c dists/${{ env.DIST }}/${{ env.COMPONENT }}/binary-${{ env.ARCH }}/Packages > dists/${{ env.DIST }}/${{ env.COMPONENT }}/binary-${{ env.ARCH }}/Packages.gz

        # Generate Release file
        apt-ftparchive release dists/${{ env.DIST }} > dists/${{ env.DIST }}/Release

        # Sign Release
        gpg --batch --yes -abs -o dists/${{ env.DIST }}/Release.gpg dists/${{ env.DIST }}/Release

    # -------------------------------
    # Commit and push APT repo
    # -------------------------------
    - name: Commit and push APT repo
      run: |
        cd pages
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout -B main
        git add .
        git commit -m "Update APT repo for release ${{ github.ref_name }}" || echo "No changes to commit"
        git push origin main
